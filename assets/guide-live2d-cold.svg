<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-label="Cold-faced black bob curator with cat eyes">
<style>
.breath{animation:breath 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.blink{animation:blink 5.2s infinite;transform-box:fill-box;transform-origin:50% 40%}
.blink.r{animation-delay:.03s}
.gaze{animation:gaze 9s ease-in-out infinite}
.head{animation:head 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.006) translateY(-2px)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(.7deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
@keyframes gaze{0%,38%,100%{transform:translateX(0)}46%,70%{transform:translateX(-3px)}78%,92%{transform:translateX(2px)}}
@keyframes head{0%,100%{transform:rotate(0)}40%{transform:rotate(-.8deg)}70%{transform:rotate(.6deg)}}
@media(prefers-reduced-motion:reduce){.breath,.sway,.blink,.gaze,.head{animation:none}}
</style>
<defs>
<linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262e3c"/><stop offset="1" stop-color="#151a24"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6db"/><stop offset="1" stop-color="#e8cdbd"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b24"/><stop offset="1" stop-color="#07070b"/></linearGradient>
