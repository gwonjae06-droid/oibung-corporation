name: New curator + linked monster art QA
on:
  push:
    branches: ["feat/new-pixel-curator-and-monster"]
    paths:
      - "assets/curator-v3/*.webp"
      - "gallery-scenes.js"
      - "gallery-scenes.css"
      - "index.html"
      - "tests/curator-v3.cjs"
      - ".github/workflows/curator-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-sprites-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate both full transparency sprite sheets and 4 poses
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          available=all(Path(f'assets/curator-v3/{key}-atlas.webp').exists() for key in ('guide','monster'))
          if not available:
            print('New sprites missing: fallback verification only, not a deployable art replacement')
            raise SystemExit(0)
          for key in ('guide','monster'):
            p=Path(f'assets/curator-v3/{key}-atlas.webp')
            assert p.exists(), f'Missing new approved {key} sprite atlas'
            im=Image.open(p).convert('RGBA')
            assert im.size==(912,408), (p,im.size)
            for i in range(4):
              frame=im.crop((i*228,0,(i+1)*228,408))
              alpha=frame.getchannel('A')
              assert alpha.getextrema()[0]==0, f'{key} frame {i} missing transparent area'
              bb=alpha.getbbox()
              assert bb and bb[2]-bb[0]>35 and bb[3]-bb[1]>300, f'{key} frame {i} silhouette truncated'
              # The user's character must have space above/on the sides.
              assert bb[0]>2 and bb[2]<226, f'{key} frame {i} touches horizontal cut boundary'
            print(p, '4 sprites validated')
          PY
      - name: Check JS parser
        run: node --check gallery-scenes.js
      - name: Install and run responsive browser regression
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/curator-v3.log 2>&1 &
          sleep 2
          if [ -f assets/curator-v3/guide-atlas.webp ] && [ -f assets/curator-v3/monster-atlas.webp ]; then
            node tests/curator-v3.cjs
          else
            node tests/pixel-hybrid.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-curator-v3-screenshots-${{ github.run_number }}
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
