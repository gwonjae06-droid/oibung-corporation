name: Paint and commit Nong-Bbang curator cels

on:
  push:
    branches: [main]
    paths:
      - tools/build_world_curator_cels.py
      - .github/workflows/world-curator-cels.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-curator-cels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render complete pixel animation cels from approved illustrations
        run: |
          python -m pip install Pillow
          python tools/build_world_curator_cels.py
          node --check world-curator.js
          node --check oibung-world.js
      - name: Verify artwork and garment pixel integrity
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          p=Path('assets/world-pixel')
          manifest=json.loads((p/'curator-cel-manifest.json').read_text())
          for form,name in (('angel','nong'),('devil','bbang')):
              filename=p/f'curator-{name}-cels.png'
              art=Image.open(filename)
              assert art.mode=='RGBA'
              assert art.size==(1504,1746)
              assert len(manifest[form]['rows'])==9
              assert art.getchannel('A').getextrema()==(0,255)
              assert filename.stat().st_size>20000
              print(form,'verified',filename.stat().st_size)
          PY
      - name: Commit rendered PNG artwork to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world-pixel/curator-nong-cels.png assets/world-pixel/curator-bbang-cels.png assets/world-pixel/curator-cel-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "art: publish 144 illustrated Nong and Bbang animation cels [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
