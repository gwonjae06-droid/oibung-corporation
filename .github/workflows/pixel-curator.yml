name: Hybrid B pixel curator QA
on:
  push:
    branches: ["feat/pixel-curator-hybrid-b"]
    paths:
      - "tools/generate_pixel_curator.py"
      - "gallery-scenes.js"
      - "gallery-scenes.css"
      - "tests/pixel-hybrid.cjs"
      - ".github/workflows/pixel-curator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-curator-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate consistent pixel characters from approved originals
        run: |
          python -m pip install Pillow
          python tools/generate_pixel_curator.py
          node --check gallery-scenes.js
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          images=list(Path("assets/pixel").glob("curator-*.png"))
          assert len(images)==7, images
          for f in images:
            im=Image.open(f).convert("RGBA")
            assert im.getchannel("A").getextrema()[0]==0
            assert 40<=im.width<=300 and im.height<=300, (f,im.size)
          print("Seven RGBA pixel sprites verified")
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test pixel art in the original museum on PC and mobile
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/pixel-museum.log 2>&1 &
          sleep 2
          node tests/pixel-hybrid.cjs
      - name: Store artwork previews and before/after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-curator-previews-${{ github.run_number }}
          path: |
            artifacts/*.png
            docs/PIXEL_HYBRID_ASSET_AUDIT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit tested pixel art files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel docs/PIXEL_HYBRID_ASSET_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: add original curator-derived pixel human and monster PNGs [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
