name: Verify and install approved curator sprites
on:
  push:
    branches: ["fix/curator-poses-blackout-ci"]
    paths:
      - "tools/prepare_curator.py"
      - "tools/finish_curator.py"
      - "tests/blackout-rebuild.cjs"
      - ".github/workflows/curator-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curator-recovery-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract transparent poses and generate audit
        run: |
          python -m pip install Pillow
          python tools/prepare_curator.py
          python tools/finish_curator.py
          node --check gallery-scenes.js
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run actual desktop, portrait, landscape gallery tests
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/oibung-curator.log 2>&1 &
          sleep 2
          node tests/blackout-rebuild.cjs
      - name: Archive alpha previews, before-blackout, light/dark captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-qa-${{ github.run_number }}
          path: |
            artifacts/*.png
            docs/CURATOR_ASSET_AUDIT.md
          retention-days: 14
          if-no-files-found: warn
      - name: Commit verified extracted assets to feature branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/curator/neutral.png assets/curator/present.png assets/curator/explain.png assets/curator/alert.png gallery-scenes.js docs/CURATOR_ASSET_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "assets: verify original curator poses and blackout staging [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
