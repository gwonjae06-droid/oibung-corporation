<defs>
 <linearGradient id="hair" x1="0" x2=".85" y1="0" y2="1"><stop stop-color="#4d4a50"/><stop offset=".43" stop-color="#25252b"/><stop offset="1" stop-color="#0d1016"/></linearGradient>
 <linearGradient id="sideHair" x1="0" x2="1" y1="0" y2=".8"><stop stop-color="#3e3941"/><stop offset=".5" stop-color="#181c23"/><stop offset="1" stop-color="#0a0e14"/></linearGradient>
