name: Finish curator staging and browser checks
on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-curator.yml, tools/finish_curator.py, tests/blackout-rebuild.cjs]
  workflow_run:
    workflows: [Prepare approved curator sprites]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finish-curator-main
  cancel-in-progress: false
jobs:
  finish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/finish_curator.py
      - run: node --check gallery-scenes.js
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/museum.log 2>&1 &
          sleep 2
          node tests/blackout-rebuild.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curator-regression-${{ github.run_number }}
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Commit only after checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery-scenes.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat: stage original curator expressions before blackout'
            git push origin HEAD:main
          fi
