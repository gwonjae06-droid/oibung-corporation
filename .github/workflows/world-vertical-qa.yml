name: Vertical town desktop and mobile smoke test
on:
  push:
    branches: [main]
    paths:
      - tests/world-vertical.cjs
      - .github/workflows/world-vertical-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and load browser
        run: |
          node --check oibung-world.js
          node --check world-curator.js
          node --check world-pixel-scenes.js
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test vertical stairs, artwork and entrance on PC and mobile
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/world-vertical.log 2>&1 &
          sleep 2
          node tests/world-vertical.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-village-screenshots-${{ github.run_number }}
          path: artifacts/vertical-*.png
          if-no-files-found: warn
          retention-days: 7
