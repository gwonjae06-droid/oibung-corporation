name: Diagnose curator sprite boundaries
on:
  push:
    branches: ["fix/curator-poses-blackout-ci"]
    paths: [".github/workflows/inspect-curator.yml"]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Measure sprite alpha mask and seams
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/curator-poses.png').convert('RGBA')
          w,h=im.size
          a=im.getchannel('A')
          import statistics
          print('SIZE',w,h, 'alpha extrema', a.getextrema())
          for i in range(1,4):
              center=round(i*w/4)
              candidates=[]
              for x in range(max(0,center-round(w*.09)),min(w,center+round(w*.09))):
                  v=sum(z>16 for z in a.crop((x,0,x+1,h)).getdata())
                  candidates.append((v,x))
              print('SEAM',i,'center',center,'min10',sorted(candidates)[:10])
          for i in range(4):
              c=a.crop((round(i*w/4),0,round((i+1)*w/4),h))
              print('CELL',i,'alpha_bbox',c.getbbox(),'alpha_left_right',sum(z>16 for z in c.crop((0,0,1,h)).getdata()),sum(z>16 for z in c.crop((c.width-1,0,c.width,h)).getdata()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: approved-curator-original-for-review
          path: assets/curator-poses.png
          retention-days: 7
