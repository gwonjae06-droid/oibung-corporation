function destination(person, index) {
  if(person.act===7)return [165,124];
  if(person.act===8)return [334,134];
  if (person.act === 4) return [32,88];
  if (person.act === 5) return lots[Math.min(2,s.houses)];
  if (person.act === 6) return s.houses ? lots[index % s.houses] : [66,114];
  return places[person.act];
}
function nextGoal(person,index) {
  if (!person.food) return s.berries?0:8;
  if (person.hunger >= 5) return 3;
  if (person.fatigue >= 4) return 6;
  if (s.houses < 3 && index % 3 === 2) return s.wood ? 5 : 4;
  if((s.tick+index)%4===0)return 7;
  return (index+s.tick%2)%3;

function finishWork(person) {
  if (person.act === 6) person.fatigue = 0;
  else person.fatigue++;
  if (person.act === 4) s.wood++;
  if (person.act === 5 && s.wood && s.houses < 3) {
    s.wood--;
    if (++s.progress === 6) {
      s.progress = 0;
      s.houses++;
      note(person.name+'의 작업으로 마을의 '+s.houses+'번째 새집이 완성됐다.');
    }
  }
}

// Navigate the walkable ground through a 64 by 64 occupancy grid.
const tileX=x=>Math.max(0,Math.min(63,Math.floor(x*64/360)));
const tileY=y=>Math.max(0,Math.min(63,Math.floor((y-72)*64/100)));
const cell=(x,y)=>tileY(y)*64+tileX(x);
const center=n=>[(n%64+.5)*360/64,72+(Math.floor(n/64)+.5)*100/64];
const blocked=new Uint8Array(4096);
for(let n=0;n<4096;n++){const [x,y]=center(n);blocked[n]=[[62,97],[133,86],[226,93],[264,112]].some(([a,b])=>x>=a&&x<a+24&&y>=b&&y<b+16)}
const maps=new Map();
function distances(goal){
 if(maps.has(goal))return maps.get(goal);
 const dist=new Int16Array(4096).fill(-1),queue=[goal];dist[goal]=0;
 for(let k=0;k<queue.length;k++){const n=queue[k];for(const m of neighbors(n)){if(!blocked[m]&&dist[m]<0){dist[m]=dist[n]+1;queue.push(m)}}}
 maps.set(goal,dist);return dist
}
function neighbors(n){return [n%64?n-1:-1,n%64<63?n+1:-1,n-64,n+64].filter(m=>m>=0&&m<4096)}
function walk(p,x,y){
 const goal=cell(x,y),dist=distances(goal);
 for(let k=0;k<2;k++){
 const n=cell(p.x,p.y);if(n===goal){p.x=x;p.y=y;return}
 const next=neighbors(n).filter(m=>dist[m]>=0).sort((a,b)=>dist[a]-dist[b])[0];
 if(next===undefined){const near=Array.from(dist).findIndex(v=>v>=0);[p.x,p.y]=center(near);continue}
 ;[p.x,p.y]=center(next)
 }}
function target(p,i){const [x,y]=destination(p,i);let tx=x+(i%4)*5,ty=y+Math.floor(i/4)*5;while(blocked[cell(tx,ty)])ty+=2;return [tx,ty]}
s.berries??=16;
for(const p of s.p){p.friends??={};p.memory??='아직 기록된 만남이 없다.'}
const ctx=map.getContext('2d'),rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h)},note=t=>{s.log.unshift(t);s.log.length=Math.min(15,s.log.length)},save=()=>{try{localStorage.marble1=JSON.stringify(s)}catch{}},sel=()=>+pick.value;names.forEach((n,i)=>pick.add(new Option(n,i)));pick.value=Math.max(0,s.apostle);function ui(){construction.textContent='열매 '+s.berries+'개 · 공동 목재 '+s.wood+'개 · 새집 '+s.houses+'/3채'+(s.houses<3?' · 다음 집 '+s.progress+'/6':' · 건설 완료');let p=s.p[sel()];let pc=portrait.getContext('2d');pc.clearRect(0,0,64,64);sprite(pc,sel(),32,58,2,0,false,-1);bio.textContent=profiles[sel()][0]+' · '+profiles[sel()][1]+' · '+traits[sel()%3]+' '+p.name+' · '+acts[p.act]+' 중 · 식량 '+p.food+' · 별 기록 '+p.stars+' · '+p.memory;choose.textContent=s.apostle===sel()?'나의 사도':'사도로 선택';oracle.hidden=s.apostle!==sel();clock.textContent='마을 '+(1+Math.floor(s.tick/48))+'일';log.replaceChildren(...s.log.map(t=>Object.assign(document.createElement('li'),{textContent:t})));}pick.onchange=()=>{reply.textContent='';ui()};choose.onclick=()=>{s.apostle=sel();note(names[sel()]+'에게 별빛이 닿았다.');save();ui()};send.onclick=()=>{let p=s.p[sel()],v=msg.value,a=/별|우주|관찰/.test(v)?2:/이웃|도와|나눠|나눔/.test(v)?1:/채집|모아|식량/.test(v)?0:-1;if(a<0){reply.textContent='채집, 이웃 돕기, 별 관찰 중 하나를 제안해 줘.';return}let why=p.hunger>=6?'지금은 배가 너무 고파요.':a===1&&p.food<2?'나눌 식량을 먼저 구할게요.':'';p.dwelling=0;p.act=why?(p.food&&p.hunger>=6?3:0):a;reply.textContent=p.name+' · '+(why||acts[a]+'을 시작할게요.');note(reply.textContent);save();ui()};function step(){s.tick++;if(s.tick%12===0)s.berries=Math.min(20,s.berries+1);s.p.forEach((p,i)=>{let [x,y]=target(p,i);walk(p,x,y);if(p.x!==x||p.y!==y)return;if((p.dwelling??0)<3){p.dwelling=(p.dwelling??0)+1;return}p.dwelling=0;

  const [x,y]=lots[i];
