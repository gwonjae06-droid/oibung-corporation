name: Oibung World visual and UX regression
on:
  push:
    branches: ["fix/world-visual-ux-and-input-polish"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check world-hd-architecture.js
          node --check world-visitor.js
          node --check oibung-world.js
          node --check world-fullscreen.js
          node --check tests/world-polish.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run visual and gameplay smoke tests
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/oibung-polish.log 2>&1 &
          sleep 2
          node tests/world-polish.cjs
      - name: Original fullscreen navigation checks
        run: node tests/world-fullscreen.cjs
      - name: Original HD architecture and frame-pacing checks
        run: node tests/world-hd.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-polish-screenshots-${{ github.run_number }}
          path: artifacts/*.png
          retention-days: 14
          if-no-files-found: ignore
