<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-label="검은 단발에 고양이눈, 차가운 표정의 안내 비서">
<style>
.breath{animation:breath 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.head{animation:head 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:50% 35%}
.blink.r{animation-delay:.03s}
.gaze{animation:gaze 9s ease-in-out infinite}
@keyframes breath{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(.8deg)}}
@keyframes head{0%,100%{transform:rotate(0)}40%{transform:rotate(-.9deg)}70%{transform:rotate(.7deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.07)}96%{transform:scaleY(1)}}
@keyframes gaze{0%,36%,100%{transform:translateX(0)}44%,68%{transform:translateX(-3px)}76%,92%{transform:translateX(2px)}}
@media(prefers-reduced-motion:reduce){.breath,.sway,.head,.blink,.gaze{animation:none}}
</style>
